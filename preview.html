  if (item.dataset.benchmarkSampleIndex != null) {
    const sampleIndex = Number(item.dataset.benchmarkSampleIndex);
    selectedCommandIds.clear();
    if (e.shiftKey && lastClickedBenchmarkSampleIndex != null) {
      const lo = Math.min(lastClickedBenchmarkSampleIndex, sampleIndex);
      const hi = Math.max(lastClickedBenchmarkSampleIndex, sampleIndex);
      for (let id = lo; id <= hi; id += 1) selectedBenchmarkSampleIndexes.add(id);
    } else if (e.ctrlKey || e.metaKey) {
      if (selectedBenchmarkSampleIndexes.has(sampleIndex)) selectedBenchmarkSampleIndexes.delete(sampleIndex);
      else selectedBenchmarkSampleIndexes.add(sampleIndex);
    } else {
      selectedBenchmarkSampleIndexes.clear();
      selectedBenchmarkSampleIndexes.add(sampleIndex);
    }
    lastClickedBenchmarkSampleIndex = sampleIndex;
    refreshSelectedStyles();
    updateAiContextBar();
    return;
  }
  const commandId = Number(item.dataset.commandId);
  if (!Number.isFinite(commandId)) return;
  setCommandCursor(commandId);
  if (e.shiftKey && lastClickedCommandId != null) {
    const lo = Math.min(lastClickedCommandId, commandId);
    const hi = Math.max(lastClickedCommandId, commandId);
    for (let id = lo; id <= hi; id += 1) selectedCommandIds.add(id);
  } else if (e.ctrlKey || e.metaKey) {
    if (selectedCommandIds.has(commandId)) selectedCommandIds.delete(commandId);
    else selectedCommandIds.add(commandId);
  } else {
    selectedCommandIds.clear();
    selectedCommandIds.add(commandId);
  }
  lastClickedCommandId = commandId;
  refreshSelectedStyles();
  updateAiContextBar();
});

let _virtualScrollRaf = false;
commandList.addEventListener('scroll', () => {
  if (_virtualScrollRaf || virtualMode === null) return;
  _virtualScrollRaf = true;
  requestAnimationFrame(() => {
    _virtualScrollRaf = false;
    ensureVirtualWindow(null);
  });
}, { passive: true });

let _pendingTimelinePayload = null;
let _timelineRafPending = false;

window.addEventListener('message', event => {
  if (event.origin !== window.location.origin) return;
  if (!event.data || typeof event.data !== 'object') return;
  if (event.data.type === 'preview-waiting') {
    loadWaitingState(event.data.payload || null);
    _pendingTimelinePayload = null;
    return;
  }
  if (event.data.type !== 'preview-load') return;
  // Coalesce rapid postMessage calls — only render the latest one per animation frame
  _pendingTimelinePayload = event.data.payload;
  if (!_timelineRafPending) {
    _timelineRafPending = true;
    requestAnimationFrame(() => {
      _timelineRafPending = false;
      if (_pendingTimelinePayload) {
        loadTimeline(_pendingTimelinePayload);
        _pendingTimelinePayload = null;
      }
    });
  }
});

let isDragging = false;
let dragMode = null; // 'orbit' | 'pan'
let lastPointerX = 0;
let lastPointerY = 0;
let isSpacePressed = false;

function updateCanvasCursor() {
  if (dragMode === 'orbit') {
    canvas.classList.add('orbiting');
    canvas.classList.remove('panning');
  } else if (dragMode === 'pan') {
    canvas.classList.add('panning');
    canvas.classList.remove('orbiting');
  } else {
    canvas.classList.remove('orbiting');
    canvas.classList.remove('panning');
  }
}

canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
});

canvas.addEventListener('mousedown', e => {
  if (playback.viewMode === 'benchmark') return;
  if (!timeline) return;

  const isRightClick = e.button === 2;
  const isLeftClick = e.button === 0;

  if (isRightClick || (isLeftClick && isSpacePressed)) {
    // Pan mode
    isDragging = true;
    dragMode = 'pan';
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    updateCanvasCursor();
    e.preventDefault();
  } else if (isLeftClick) {
    if (playback.viewMode === 'perspective') {
      // Orbit mode
      isDragging = true;
      dragMode = 'orbit';
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      updateCanvasCursor();
      e.preventDefault();
    }
  }
});

window.addEventListener('mousemove', e => {
  if (!isDragging || !dragMode) return;

  const dx = e.clientX - lastPointerX;
  const dy = e.clientY - lastPointerY;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;

  if (dragMode === 'orbit') {
    camera.yaw += dx * 0.008;
    camera.pitch = Math.max(0.05, Math.min(Math.PI / 2 - 0.05, camera.pitch - dy * 0.008));
    render();
  } else if (dragMode === 'pan') {
    camera.panX += dx;
    camera.panY += dy;
    render();
  }
});

window.addEventListener('mouseup', e => {
  if (isDragging) {
    isDragging = false;
    dragMode = null;
    updateCanvasCursor();
  }
});

window.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) {
    return;
  }

  if (e.code === 'Space' && !e.repeat) {
    isSpacePressed = true;
    if (!isDragging) {
      canvas.classList.add('panning');
    }
    e.preventDefault();
  } else if (!e.ctrlKey && !e.altKey && !e.metaKey) {
    const key = e.key.toLowerCase();
    if (key === 't') {
      playback.viewMode = 'top';
      viewSelect.value = 'top';
      applyViewModeUi();
      render();
    } else if (key === 'f') {
      playback.viewMode = 'front';
      viewSelect.value = 'front';
      applyViewModeUi();
      render();
    } else if (key === 'r') {
      playback.viewMode = 'right';
      viewSelect.value = 'right';
      applyViewModeUi();
      render();
    } else if (key === 'p' || key === 'h') {
      playback.viewMode = 'perspective';
      viewSelect.value = 'perspective';
      applyViewModeUi();
      render();
    } else if (key === 'z') {
      fitPreview();
    }
  }
});

window.addEventListener('keyup', e => {
  if (e.code === 'Space') {
    isSpacePressed = false;
    if (!isDragging) {
      updateCanvasCursor();
    }
    e.preventDefault();
  }
});

window.addEventListener('resize', resizeCanvas);
window.addEventListener('beforeunload', () => {
  if (window.opener && !window.opener.closed) {
    try { window.opener.postMessage({ type: 'preview-closed' }, window.location.origin); } catch {}
  }
});

resizeCanvas();
syncPlaybackUi();
syncQueuePanelUi();
requestAnimationFrame(tick);

if (window.opener && !window.opener.closed) {
  try {
    window.opener.postMessage({ type: 'preview-ready' }, window.location.origin);
  } catch {}
}
</script>
