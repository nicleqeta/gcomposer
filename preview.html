<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRBL Preview</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3347;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --teal: #14b8a6;
    --amber: #f59e0b;
    --red: #ef4444;
    --green: #22c55e;
    --blue: #60a5fa;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", Arial, sans-serif; }
  body { display: flex; flex-direction: column; }

  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-wrap: wrap;
  }

  .title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-right: auto;
  }

  .btn, .select {
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 12px;
  }

  .btn {
    cursor: pointer;
  }

  .btn:hover, .select:hover { border-color: var(--teal); }

  .stats {
    display: flex;
    gap: 10px;
    color: var(--muted);
    font-size: 12px;
  }

  .shell {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
  }

  .viewport {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: radial-gradient(circle at top, rgba(20,184,166,0.08), transparent 36%), var(--bg);
  }

  .canvas-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
  }

  .benchmark-info-panel {
    display: none;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: rgba(26, 29, 39, 0.82);
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-line;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas.orbiting { cursor: grab; }
  canvas.panning { cursor: move; }

  .status-box {
    display: none;
    position: absolute;
    left: 12px;
    top: 12px;
    padding: 10px 12px;
    background: rgba(26, 29, 39, 0.92);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
    max-width: 360px;
    white-space: pre-line;
  }

  .sidebar {
    border-left: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .side-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }

  .command-list {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    flex: 1;
    position: relative;
    font-family: Consolas, 'Courier New', monospace;
    font-size: 12px;
    line-height: 1.35;
  }

  .queue-panel {
    border-top: 1px solid var(--border);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--surface);
  }

  .queue-panel-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .queue-panel-row .select {
    flex: 1;
    min-width: 0;
  }

  .queue-panel .btn {
    width: 100%;
  }

  .queue-check {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 12px;
  }

  .queue-status {
    color: var(--muted);
    font-size: 11px;
    min-height: 16px;
  }

  .command-item {
    position: absolute;
    left: 0;
    right: 0;
    border-bottom: 1px solid rgba(46, 51, 71, 0.35);
    padding: 0 10px;
    cursor: pointer;
    color: var(--muted);
    height: 24px;
    line-height: 23px;
    box-sizing: border-box;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .command-item:hover { background: rgba(34, 38, 58, 0.6); }
  .command-item.active { background: rgba(20, 184, 166, 0.14); border-left: 2px solid var(--teal); color: var(--text); padding-left: 8px; }
    .command-item.selected { background: rgba(59, 130, 246, 0.14); border-left: 2px solid var(--blue); color: var(--text); padding-left: 8px; }
    .command-item.selected.active { background: rgba(59, 130, 246, 0.22); border-left: 2px solid var(--blue); }
    .ai-context-bar { border-top: 1px solid var(--border); padding: 8px 10px; display: flex; align-items: center; gap: 8px; background: var(--surface); flex-shrink: 0; }
    .ai-context-bar .btn { flex: 1; font-size: 11px; padding: 5px 8px; }
    .ai-context-count { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .command-line { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
  .command-text { color: var(--text); font-family: Consolas, monospace; font-size: 12px; word-break: break-word; }
  .command-meta { color: var(--muted); font-size: 11px; margin-top: 4px; }

  .empty {
    margin: auto;
    max-width: 440px;
    text-align: center;
    color: var(--muted);
    line-height: 1.7;
    padding: 24px;
  }

  .empty strong { color: var(--text); }

  .benchmark-tape-panel {
    display: none;
    flex-direction: column;
    min-height: 0;
    border-top: 1px solid var(--border);
    background: var(--surface);
    max-height: 196px;
  }

  .benchmark-tape-panel.active {
    display: flex;
  }

  .tape-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
    gap: 8px;
  }

  .tape-title {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
  }

  .tape-copy-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 5px;
    padding: 6px 10px;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
  }

  .tape-copy-btn:hover {
    border-color: var(--teal);
    background: rgba(20, 184, 166, 0.08);
  }

  .tape-content {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    font-family: Consolas, 'Courier New', monospace;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
    background: rgba(15, 17, 23, 0.5);
  }

  .tape-content code {
    color: var(--text);
    background: rgba(0, 0, 0, 0.3);
    padding: 1px 3px;
    border-radius: 2px;
  }

  @media (max-width: 960px) {
    .shell { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 280px; }
    .sidebar { border-left: 0; border-top: 1px solid var(--border); }
  }

  body.benchmark-mode #rewind-btn,
  body.benchmark-mode #step-back-btn,
  body.benchmark-mode #speed-select,
  body.benchmark-mode #play-btn,
  body.benchmark-mode #step-forward-btn,
  body.benchmark-mode #end-btn,
  body.benchmark-mode #fit-btn,
  body.benchmark-mode #shading-btn,
  body.benchmark-mode .queue-panel { display: none; }

  body.benchmark-mode .shell { grid-template-columns: minmax(0, 1fr) 320px; }
  body.benchmark-mode .benchmark-info-panel { display: block; }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="title" id="title">GRBL Preview</div>
    <button class="btn" id="rewind-btn" type="button">Rewind</button>
    <button class="btn" id="step-back-btn" type="button">Step Back</button>
    <select class="select" id="speed-select" aria-label="Playback speed">
      <option value="0.5">0.5x</option>
      <option value="1">1x</option>
      <option value="2">2x</option>
      <option value="4">4x</option>
      <option value="8" selected>8x</option>
    </select>
    <button class="btn" id="play-btn" type="button">Play</button>
    <button class="btn" id="step-forward-btn" type="button">Step Forward</button>
    <button class="btn" id="end-btn" type="button">End</button>
    <button class="btn" id="fit-btn" type="button">Fit</button>
    <button class="btn" id="shading-btn" type="button" title="Toggle 3D shaded solid-wire reflection">Wire: 3D</button>
    <select class="select" id="view-select" aria-label="Preview mode">
      <option value="perspective">Perspective</option>
      <option value="top">Top (XY)</option>
      <option value="front">Front (ZX)</option>
      <option value="right">Right (ZY)</option>
      <option value="benchmark">Benchmark</option>
    </select>
    <div class="stats" id="stats"></div>
  </div>

  <div class="shell">
    <div class="viewport">
      <div class="benchmark-info-panel" id="benchmark-info-panel"></div>
      <div class="canvas-wrap">
        <canvas id="preview-canvas"></canvas>
        <div class="status-box" id="status-box">Waiting for preview data from the main window.</div>
        <div class="empty" id="empty-state"><strong>No preview loaded.</strong><br>Return to the main app and click Preview on a GCOM script.</div>
      </div>
      <div class="benchmark-tape-panel" id="benchmark-tape-panel">
        <div class="tape-header">
          <span class="tape-title">Benchmark Data (AI Format)</span>
          <button class="tape-copy-btn" id="tape-copy-btn" type="button">Copy JSON</button>
        </div>
        <div class="tape-content" id="tape-content"></div>
      </div>
    </div>
    <aside class="sidebar">
      <div class="side-header">
        <span>Command Tape</span>
        <span id="command-progress">0 / 0</span>
      </div>
      <ul class="command-list" id="command-list"></ul>
        <div class="ai-context-bar" id="ai-context-bar">
          <span class="ai-context-count" id="ai-context-count">0 selected</span>
          <button class="btn" id="send-to-ai-btn" type="button" disabled>Send to AI</button>
        </div>
      <div class="queue-panel">
        <div class="queue-panel-row">
          <select class="select" id="queue-mode-select" aria-label="Queue execution mode">
            <option value="sync-ack">Synchronous (ack-gated)</option>
            <option value="fast-buffer" selected>Fast buffered</option>
          </select>
        </div>
        <label class="queue-check">
          <input type="checkbox" id="queue-include-nonmotion" checked>
          Include non-motion commands
        </label>
        <button class="btn" id="queue-from-preview-btn" type="button">Queue as GCode</button>
        <div class="queue-status" id="queue-status">Queue target ready.</div>
      </div>
    </aside>
  </div>

<script>
const canvas = document.getElementById('preview-canvas');
const ctx = canvas.getContext('2d');
const titleEl = document.getElementById('title');
const statsEl = document.getElementById('stats');
const statusBox = document.getElementById('status-box');
const benchmarkInfoPanel = document.getElementById('benchmark-info-panel');
const emptyState = document.getElementById('empty-state');
const commandList = document.getElementById('command-list');
const commandProgress = document.getElementById('command-progress');
const sendToAiBtn = document.getElementById('send-to-ai-btn');
const aiContextCount = document.getElementById('ai-context-count');
const benchmarkTapePanel = document.getElementById('benchmark-tape-panel');
const tapeContent = document.getElementById('tape-content');
const tapeCopyBtn = document.getElementById('tape-copy-btn');
const rewindBtn = document.getElementById('rewind-btn');
const playBtn = document.getElementById('play-btn');
const stepBackBtn = document.getElementById('step-back-btn');
const stepForwardBtn = document.getElementById('step-forward-btn');
const endBtn = document.getElementById('end-btn');
const fitBtn = document.getElementById('fit-btn');
const shadingBtn = document.getElementById('shading-btn');
const viewSelect = document.getElementById('view-select');
const speedSelect = document.getElementById('speed-select');
const queueModeSelect = document.getElementById('queue-mode-select');
const queueIncludeNonMotion = document.getElementById('queue-include-nonmotion');
const queueFromPreviewBtn = document.getElementById('queue-from-preview-btn');
const queueStatus = document.getElementById('queue-status');

let timeline = null;
let commandItems = [];
let lastActiveCommandId = -1;
// Virtualized command list state
const COMMAND_ROW_HEIGHT = 24;   // must match .command-item CSS height
const COMMAND_WINDOW_BUFFER = 10; // extra rows rendered above/below the viewport
let virtualRange = { start: 0, end: 0 };
let virtualMode = null;          // 'commands' | 'benchmark' | null
let virtualCount = 0;            // total rows in current mode
let virtualSpacer = null;        // <li> that reserves scroll height
let selectedCommandIds = new Set();
let selectedBenchmarkSampleIndexes = new Set();
let lastClickedCommandId = null;
let lastClickedBenchmarkSampleIndex = null;
const PREVIEW_MIN_ZOOM = 0.2;
const PREVIEW_MAX_ZOOM = 6;
let canvasCssWidth = 1;
let canvasCssHeight = 1;
let lastStatusText = '';
let lastBenchmarkInfoText = '';
const staticLayerCanvas = document.createElement('canvas');
const staticLayerCtx = staticLayerCanvas.getContext('2d');
let staticLayerKey = '';
let camera = {
  yaw: -Math.PI / 4,
  pitch: Math.PI / 3.4,
  panX: 0,
  panY: 0
};

const DEFAULT_CAMERA = {
  yaw: -Math.PI / 4,
  pitch: Math.PI / 3.4,
  panX: 0,
  panY: 0
};

let playback = {
  playing: false,
  commandCursor: 0,
  speed: 8,
  viewMode: 'top',
  baseCommandMs: 260,
  lastFrameAt: 0,
  accumulatorMs: 0,
  zoom: 1,
  wireShading: true
};

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  canvasCssWidth = Math.max(1, Math.round(rect.width));
  canvasCssHeight = Math.max(1, Math.round(rect.height));
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(canvasCssWidth * ratio));
  canvas.height = Math.max(1, Math.round(canvasCssHeight * ratio));
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  staticLayerCanvas.width = canvasCssWidth;
  staticLayerCanvas.height = canvasCssHeight;
  staticLayerKey = '';
  render();
}

function setStatusText(nextText) {
  const text = String(nextText || '');
  if (text === lastStatusText) return;
  statusBox.textContent = text;
  lastStatusText = text;
}

function setBenchmarkInfoText(nextText) {
  const text = String(nextText || '');
  if (text === lastBenchmarkInfoText) return;
  benchmarkInfoPanel.textContent = text;
  lastBenchmarkInfoText = text;
}

function resetCamera() {
  camera.yaw = DEFAULT_CAMERA.yaw;
  camera.pitch = DEFAULT_CAMERA.pitch;
  camera.panX = 0;
  camera.panY = 0;
}

function resetPlayback({ atEnd = true } = {}) {
  playback.playing = false;
  if (timeline && timeline.commandCount) {
    playback.commandCursor = atEnd ? timeline.commandCount - 1 : 0;
  } else {
    playback.commandCursor = 0;
  }
  playback.accumulatorMs = 0;
  playback.lastFrameAt = 0;
  playback.zoom = 1;
  resetCamera();
  syncPlaybackUi();
}

function jumpToEnd() {
  if (!timeline || !timeline.commandCount) return;
  playback.playing = false;
  setCommandCursor(timeline.commandCount - 1);
}

function syncPlaybackUi() {
  playBtn.textContent = playback.playing ? 'Pause' : 'Play';
  viewSelect.value = playback.viewMode;
  speedSelect.value = String(playback.speed);
  shadingBtn.textContent = playback.wireShading ? 'Wire: 3D' : 'Wire: Flat';
  shadingBtn.style.color = playback.wireShading ? 'var(--teal)' : 'var(--muted)';
  const count = timeline ? timeline.commandCount : 0;
  const displayIndex = count ? Math.min(playback.commandCursor + 1, count) : 0;
  commandProgress.textContent = `${displayIndex} / ${count}`;
}

function clampCommandCursor(value) {
  if (!timeline || !timeline.commandCount) return 0;
  return Math.max(0, Math.min(timeline.commandCount - 1, value));
}

function setCommandCursor(nextCommandId) {
  const previousCursor = playback.commandCursor;
  playback.commandCursor = clampCommandCursor(nextCommandId);
  syncPlaybackUi();
  updateCommandListActive(previousCursor, playback.commandCursor, true);
  render();
}

function stepCommands(delta) {
  if (!timeline || !timeline.commandCount) return;
  setCommandCursor(playback.commandCursor + delta);
}

function fitPreview() {
  playback.zoom = 1;
  resetCamera();
  render();
}

function applyWheelZoom(event) {
  if (playback.viewMode === 'benchmark') return;
  if (!timeline) return;
  event.preventDefault();
  const direction = event.deltaY > 0 ? -1 : 1;
  const factor = direction > 0 ? 1.1 : 1 / 1.1;
  const nextZoom = Math.max(PREVIEW_MIN_ZOOM, Math.min(PREVIEW_MAX_ZOOM, playback.zoom * factor));
  if (nextZoom === playback.zoom) return;
  playback.zoom = nextZoom;
  render();
}

function applyViewModeUi() {
  document.body.classList.toggle('benchmark-mode', playback.viewMode === 'benchmark');
}

function getBenchmarkSummary() {
  return Array.isArray(timeline?.benchmark?.summary) ? timeline.benchmark.summary : [];
}

function getBenchmarkSamples() {
  return Array.isArray(timeline?.benchmark?.samples) ? timeline.benchmark.samples : [];
}

function getBenchmarkSeries() {
  return Array.isArray(timeline?.benchmark?.series) ? timeline.benchmark.series : [];
}

function getBenchmarkActiveMarkers() {
  return Array.isArray(timeline?.benchmark?.activeMarkers) ? timeline.benchmark.activeMarkers : [];
}

function formatBenchmarkDataForAI() {
  if (!timeline || !timeline.benchmark) return null;
  const { benchmark } = timeline;
  const summary = getBenchmarkSummary();
  const samples = getBenchmarkSamples();
  const series = getBenchmarkSeries();
  const activeMarkers = getBenchmarkActiveMarkers();
  return {
    metadata: {
      ...(benchmark.meta || {}),
      title: benchmark.meta?.title || benchmark.title || 'BASIC Benchmark',
      description: benchmark.meta?.description || 'Generic BENCH stream capture for AI-driven visualization',
      format: 'JSON object with metadata, series, active markers, and raw records',
      startedAtIso: benchmark.startedAtIso,
      updatedAtIso: benchmark.updatedAtIso,
      sampleCount: samples.length,
      summaryCount: summary.length,
      seriesCount: series.length,
      activeMarkerCount: activeMarkers.length,
      xField: benchmark.meta?.xField || 'sampleIndex',
      yField: benchmark.meta?.yField || 'elapsedMs',
      seriesField: benchmark.meta?.seriesField || ''
    },
    summary,
    series,
    activeMarkers,
    records: Array.isArray(benchmark.records) ? benchmark.records : samples,
    samples
  };
}

let _lastTapeSampleCount = -1;

function renderBenchmarkDataTape() {
  const data = formatBenchmarkDataForAI();
  if (!data) {
    benchmarkTapePanel.classList.remove('active');
    _lastTapeSampleCount = -1;
    return;
  }
  benchmarkTapePanel.classList.add('active');
  // Skip expensive JSON.stringify + scroll when sample count hasn't changed
  if (data.samples.length === _lastTapeSampleCount) return;
  _lastTapeSampleCount = data.samples.length;
  tapeContent.textContent = JSON.stringify(data, null, 2);
  tapeContent.scrollTop = tapeContent.scrollHeight;
}

function copyBenchmarkDataToClipboard() {
  const data = formatBenchmarkDataForAI();
  if (!data) return;
  const jsonStr = JSON.stringify(data, null, 2);
  navigator.clipboard.writeText(jsonStr).then(() => {
    const originalText = tapeCopyBtn.textContent;
    tapeCopyBtn.textContent = 'Copied!';
    setTimeout(() => { tapeCopyBtn.textContent = originalText; }, 2000);
  }).catch(err => {
    console.error('Failed to copy to clipboard:', err);
  });
}

function renderBenchmarkChart(width, height) {
  const samples = getBenchmarkSamples();
  const series = getBenchmarkSeries();
  const activeMarkers = getBenchmarkActiveMarkers();
  const latestSample = timeline?.benchmark?.latestSample || null;
  const activeFields = activeMarkers[0]?.fields || null;
  const activeText = activeFields
    ? Object.entries(activeFields).map(([k, v]) => `${k}=${v}`).join(' ')
    : '';
  const meta = timeline?.benchmark?.meta || {};
  const xLabel = String(meta.xLabel || meta.xField || 'X');
  const yLabel = String(meta.yLabel || meta.yField || 'Y');
  const margin = { top: 36, right: 28, bottom: 68, left: 68 };
  const plotWidth = Math.max(120, width - margin.left - margin.right);
  const plotHeight = Math.max(120, height - margin.top - margin.bottom);
  const palette = ['#f59e0b', '#60a5fa', '#22c55e', '#ef4444', '#a78bfa', '#14b8a6', '#f97316', '#38bdf8'];
  const styles = meta.styles && typeof meta.styles === 'object' ? meta.styles : {};
  const colorBy = String(meta.colorBy || '').trim().toLowerCase();
  const colorKeys = new Map();
  const getStyleForYField = yField => styles[String(yField || '').toLowerCase()] || {};
  const styleEnabled = value => !['0', 'false', 'no', 'off', 'none'].includes(String(value || '').trim().toLowerCase());
  const getSeriesColor = (item, fallbackIndex) => {
    const points = Array.isArray(item.points) ? item.points : [];
    const firstPoint = points[0] || {};
    const fields = firstPoint.fields || {};
    const key = colorBy ? String(fields[colorBy] ?? item.name ?? fallbackIndex) : String(item.name ?? fallbackIndex);
    if (!colorKeys.has(key)) colorKeys.set(key, colorKeys.size);
    return palette[colorKeys.get(key) % palette.length];
  };
  const drawMarker = (x, y, marker, color) => {
    const shape = String(marker || 'dot').trim().toLowerCase();
    if (['0', 'false', 'no', 'off', 'none'].includes(shape)) return;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2;
    if (shape === 'x' || shape === 'cross') {
      ctx.beginPath();
      ctx.moveTo(x - 4, y - 4);
      ctx.lineTo(x + 4, y + 4);
      ctx.moveTo(x + 4, y - 4);
      ctx.lineTo(x - 4, y + 4);
      ctx.stroke();
      return;
    }
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fill();
  };

  ctx.save();
  ctx.fillStyle = 'rgba(15, 17, 23, 0.94)';
  ctx.fillRect(0, 0, width, height);

  ctx.strokeStyle = 'rgba(148, 163, 184, 0.20)';
  ctx.strokeRect(margin.left, margin.top, plotWidth, plotHeight);

  ctx.fillStyle = '#94a3b8';
  ctx.font = '12px Segoe UI, Arial, sans-serif';
  ctx.fillText(String(meta.title || timeline.title || 'Generic Benchmark'), margin.left, 20);

  const allPoints = [];
  series.forEach(item => {
    (item.points || []).forEach(point => allPoints.push(point));
  });

  if (!allPoints.length) {
    ctx.fillStyle = '#94a3b8';
    ctx.font = '14px Segoe UI, Arial, sans-serif';
    ctx.fillText('Waiting for benchmark samples from a live BASIC run.', margin.left, margin.top + 28);
    ctx.restore();
    const benchmarkInfoText = [
      `${timeline.title || 'GRBL Preview'}`,
      'View: Benchmark',
      `Samples: ${samples.length}`,
      activeText ? `Active: ${activeText}` : 'Awaiting first completed BENCH marker pair'
    ].join('\n');
    setStatusText(benchmarkInfoText);
    setBenchmarkInfoText(benchmarkInfoText);
    return;
  }

  const xMin = Math.min(...allPoints.map(point => Number(point.x)));
  const xMax = Math.max(...allPoints.map(point => Number(point.x)));
  const yMin = Math.min(...allPoints.map(point => Number(point.y)));
  const yMax = Math.max(...allPoints.map(point => Number(point.y)));
  const xSpan = Math.max(1e-9, xMax - xMin);
  const ySpan = Math.max(1e-9, yMax - yMin);

  const pointX = x => margin.left + ((Number(x) - xMin) / xSpan) * plotWidth;
  const pointY = y => margin.top + plotHeight - ((Number(y) - yMin) / ySpan) * plotHeight;
  const formatAxisTick = value => {
    const numericValue = Number(value);
    if (!Number.isFinite(numericValue)) return '';
    if (Math.abs(numericValue) >= 100) return numericValue.toFixed(0);
    if (Math.abs(numericValue) >= 10) return numericValue.toFixed(1).replace(/\.0$/, '');
    return numericValue.toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
  };

  ctx.strokeStyle = 'rgba(148, 163, 184, 0.12)';
  ctx.lineWidth = 1;
  for (let tick = 0; tick <= 4; tick += 1) {
    const y = margin.top + (plotHeight * tick) / 4;
    ctx.beginPath();
    ctx.moveTo(margin.left, y);
    ctx.lineTo(margin.left + plotWidth, y);
    ctx.stroke();

    const yLabelValue = (yMax - ((ySpan * tick) / 4)).toFixed(2);
    ctx.fillStyle = '#94a3b8';
    ctx.textAlign = 'right';
    ctx.fillText(yLabelValue, margin.left - 10, y + 4);
    ctx.textAlign = 'start';
  }

  ctx.textAlign = 'center';
  for (let tick = 0; tick <= 4; tick += 1) {
    const x = margin.left + (plotWidth * tick) / 4;
    ctx.beginPath();
    ctx.moveTo(x, margin.top);
    ctx.lineTo(x, margin.top + plotHeight);
    ctx.stroke();

    const xLabelValue = formatAxisTick(xMin + ((xSpan * tick) / 4));
    ctx.fillStyle = '#94a3b8';
    ctx.fillText(xLabelValue, x, margin.top + plotHeight + 18);
  }
  ctx.textAlign = 'start';

  series.forEach((item, seriesIndex) => {
    const color = getSeriesColor(item, seriesIndex);
    const points = Array.isArray(item.points) ? item.points : [];
    if (!points.length) return;
    const yField = points[0]?.yField || '';
    const style = getStyleForYField(yField);
    const shouldDrawLine = !Object.prototype.hasOwnProperty.call(style, 'line') || styleEnabled(style.line);
    const marker = style.marker || 'dot';

    if (shouldDrawLine) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      points.forEach((point, index) => {
        const x = pointX(point.x);
        const y = pointY(point.y);
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    points.forEach(point => {
      const x = pointX(point.x);
      const y = pointY(point.y);
      drawMarker(x, y, marker, color);
    });
  });

  const legendItems = series.filter(item => Array.isArray(item.points) && item.points.length).slice(0, 12);
  if (legendItems.length) {
    const legendX = margin.left + 10;
    let legendY = margin.top + 14;
    ctx.font = '11px Segoe UI, Arial, sans-serif';
    legendItems.forEach((item, index) => {
      const color = getSeriesColor(item, index);
      const points = Array.isArray(item.points) ? item.points : [];
      const yField = points[0]?.yField || '';
      const style = getStyleForYField(yField);
      const shouldDrawLine = !Object.prototype.hasOwnProperty.call(style, 'line') || styleEnabled(style.line);
      const marker = style.marker || 'dot';
      ctx.fillStyle = color;
      if (shouldDrawLine) ctx.fillRect(legendX, legendY - 8, 10, 2);
      drawMarker(legendX + 5, legendY - 7, marker, color);
      ctx.fillStyle = '#cbd5e1';
      ctx.fillText(String(item.name || `Series ${index + 1}`).slice(0, 34), legendX + 16, legendY - 4);
      legendY += 14;
    });
  }

  ctx.save();
  ctx.translate(16, margin.top + plotHeight / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillStyle = '#94a3b8';
  ctx.textAlign = 'center';
  ctx.fillText(yLabel, 0, 0);
  ctx.restore();

  ctx.fillStyle = '#94a3b8';
  ctx.fillText(xLabel, margin.left + plotWidth / 2 - 18, height - 20);
  ctx.restore();

  const benchmarkInfoText = [
    `${timeline.title || 'GRBL Preview'}`,
    'View: Benchmark',
    `Samples: ${samples.length}`,
    `Series: ${series.length}`,
    latestSample
      ? `Latest: ${Number(latestSample.elapsedMs || 0).toFixed(1)} ms`
      : 'Latest: none',
    activeText ? `Active: ${activeText}` : 'Active: (idle)'
  ].join('\n');
  setStatusText(benchmarkInfoText);
  setBenchmarkInfoText(benchmarkInfoText);
}

function getVisibleSegmentEnd() {
  if (!timeline || !timeline.commandCount) return -1;
  for (let commandId = playback.commandCursor; commandId >= 0; commandId -= 1) {
    const segmentIndex = timeline.commandToLastSegment[commandId];
    if (typeof segmentIndex === 'number' && segmentIndex >= 0) return segmentIndex;
  }
  return -1;
}

// Wire 3D shading palette: smooth ramp from deep slate-teal to vivid teal (never white).
const WIRE_BUCKET_COUNT = 64;
const WIRE_AMBIENT = 0.01;
const WIRE_DEPTH_FALLOFF = 0.33;
const WIRE_BUCKET_COLORS = [];
const WIRE_BUCKET_WIDTHS = [];
function buildWirePalette() {
  WIRE_BUCKET_COLORS.length = 0;
  WIRE_BUCKET_WIDTHS.length = 0;
  const stops = [
    [0.0, 5, 30, 29],
    [0.45, 16, 120, 110],
    [0.8, 24, 190, 170],
    [1.0, 64, 232, 210]
  ];
  for (let i = 0; i < WIRE_BUCKET_COUNT; i += 1) {
    const t = i / (WIRE_BUCKET_COUNT - 1);
    let s = 1;
    while (s < stops.length - 1 && t > stops[s][0]) s += 1;
    const a = stops[s - 1];
    const b = stops[s];
    const k = (t - a[0]) / (b[0] - a[0]);
    const r = Math.round(a[1] + ((b[1] - a[1]) * k));
    const g = Math.round(a[2] + ((b[2] - a[2]) * k));
    const bl = Math.round(a[3] + ((b[3] - a[3]) * k));
    WIRE_BUCKET_COLORS.push(`rgba(${r}, ${g}, ${bl}, ${(0.9 + (0.08 * t)).toFixed(3)})`);
    WIRE_BUCKET_WIDTHS.push(1.6 + (0.8 * t));
  }
}
buildWirePalette();
function projectTopInto(point, bounds, scale, offsetX, offsetY, out) {
  const cx = bounds.min.x + (bounds.span.x / 2);
  const cy = bounds.min.y + (bounds.span.y / 2);
  out.x = offsetX + ((point.x - cx) * scale);
  out.y = offsetY - ((point.y - cy) * scale);
  return out;
}

function projectFrontInto(point, bounds, scale, offsetX, offsetY, out) {
  const cx = bounds.min.x + (bounds.span.x / 2);
  const cz = bounds.min.z + (bounds.span.z / 2);
  out.x = offsetX + ((point.x - cx) * scale);
  out.y = offsetY - ((point.z - cz) * scale);
  return out;
}

function projectRightInto(point, bounds, scale, offsetX, offsetY, out) {
  const cy = bounds.min.y + (bounds.span.y / 2);
  const cz = bounds.min.z + (bounds.span.z / 2);
  out.x = offsetX + ((point.y - cy) * scale);
  out.y = offsetY - ((point.z - cz) * scale);
  return out;
}

function projectPerspectiveInto(point, center, scale, offsetX, offsetY, out) {
  const dx = point.x - center.x;
  const dy = point.y - center.y;
  const dz = point.z - center.z;
  const yaw = camera.yaw;
  const pitch = camera.pitch;
  const x1 = (Math.cos(yaw) * dx) - (Math.sin(yaw) * dy);
  const y1 = (Math.sin(yaw) * dx) + (Math.cos(yaw) * dy);
  // Screen-space Y increases downward, so invert Z here to keep +Z visually upward.
  const z1 = -dz;
  const y2 = (Math.cos(pitch) * y1) - (Math.sin(pitch) * z1);
  const z2 = (Math.sin(pitch) * y1) + (Math.cos(pitch) * z1);
  const depth = 650 + z2;
  const perspectiveScale = (650 / Math.max(120, depth)) * scale;
  out.x = offsetX + (x1 * perspectiveScale);
  out.y = offsetY - (y2 * perspectiveScale);
  return out;
}

function computeSceneScale(bounds, width, height) {
  if (playback.viewMode === 'front') {
    const spanX = Math.max(1, bounds.span.x);
    const spanZ = Math.max(1, bounds.span.z);
    const scaleX = (width * 0.72) / spanX;
    const scaleZ = (height * 0.72) / spanZ;
    return Math.min(scaleX, scaleZ) * playback.zoom;
  }
  if (playback.viewMode === 'right') {
    const spanY = Math.max(1, bounds.span.y);
    const spanZ = Math.max(1, bounds.span.z);
    const scaleY = (width * 0.72) / spanY;
    const scaleZ = (height * 0.72) / spanZ;
    return Math.min(scaleY, scaleZ) * playback.zoom;
  }
  if (playback.viewMode === 'top') {
    const spanX = Math.max(1, bounds.span.x);
    const spanY = Math.max(1, bounds.span.y);
    const scaleX = (width * 0.72) / spanX;
    const scaleY = (height * 0.72) / spanY;
    return Math.min(scaleX, scaleY) * playback.zoom;
  }
  const spanX = Math.max(1, bounds.span.x);
  const spanY = Math.max(1, bounds.span.y);
  const spanZ = Math.max(1, bounds.span.z);
  const size = Math.max(spanX, spanY, spanZ);
  return ((Math.min(width, height) * 0.72) / size) * playback.zoom;
}

function renderGrid(drawCtx, bounds, width, height, offsetX, offsetY, scale) {
  const stepBase = Math.max(bounds.span.x, bounds.span.y, 50);
  const step = Math.max(1, Math.pow(10, Math.floor(Math.log10(stepBase)) - 1));
  const minX = Math.min(0, bounds.min.x);
  const maxX = Math.max(0, bounds.max.x);
  const minY = Math.min(0, bounds.min.y);
  const maxY = Math.max(0, bounds.max.y);
  const startX = Math.floor(minX / step) * step;
  const endX = Math.ceil(maxX / step) * step;
  const startY = Math.floor(minY / step) * step;
  const endY = Math.ceil(maxY / step) * step;
  const from = { x: 0, y: 0 };
  const to = { x: 0, y: 0 };
  drawCtx.save();
  drawCtx.strokeStyle = 'rgba(148, 163, 184, 0.10)';
  drawCtx.lineWidth = 1;
  for (let x = startX; x <= endX + (step * 0.001); x += step) {
    projectTopInto({ x, y: startY, z: 0 }, bounds, scale, offsetX, offsetY, from);
    projectTopInto({ x, y: endY, z: 0 }, bounds, scale, offsetX, offsetY, to);
    drawCtx.beginPath();
    drawCtx.moveTo(from.x, from.y);
    drawCtx.lineTo(to.x, to.y);
    drawCtx.stroke();
  }
  for (let y = startY; y <= endY + (step * 0.001); y += step) {
    projectTopInto({ x: startX, y, z: 0 }, bounds, scale, offsetX, offsetY, from);
    projectTopInto({ x: endX, y, z: 0 }, bounds, scale, offsetX, offsetY, to);
    drawCtx.beginPath();
    drawCtx.moveTo(from.x, from.y);
    drawCtx.lineTo(to.x, to.y);
    drawCtx.stroke();
  }
  drawCtx.restore();
}

function renderPerspectiveGrid(drawCtx, bounds, center, width, height, offsetX, offsetY, scale) {
  const stepBase = Math.max(bounds.span.x, bounds.span.y, 50);
  const step = Math.max(1, Math.pow(10, Math.floor(Math.log10(stepBase)) - 1));
  const minX = Math.min(0, bounds.min.x);
  const maxX = Math.max(0, bounds.max.x);
  const minY = Math.min(0, bounds.min.y);
  const maxY = Math.max(0, bounds.max.y);
  const startX = Math.floor(minX / step) * step;
  const endX = Math.ceil(maxX / step) * step;
  const startY = Math.floor(minY / step) * step;
  const endY = Math.ceil(maxY / step) * step;
  const from = { x: 0, y: 0 };
  const to = { x: 0, y: 0 };
  drawCtx.save();
  drawCtx.strokeStyle = 'rgba(148, 163, 184, 0.10)';
  drawCtx.lineWidth = 1;

  for (let x = startX; x <= endX + (step * 0.001); x += step) {
    projectPerspectiveInto({ x, y: startY, z: 0 }, center, scale, offsetX, offsetY, from);
    projectPerspectiveInto({ x, y: endY, z: 0 }, center, scale, offsetX, offsetY, to);
    drawCtx.beginPath();
    drawCtx.moveTo(from.x, from.y);
    drawCtx.lineTo(to.x, to.y);
    drawCtx.stroke();
  }
  for (let y = startY; y <= endY + (step * 0.001); y += step) {
    projectPerspectiveInto({ x: startX, y, z: 0 }, center, scale, offsetX, offsetY, from);
    projectPerspectiveInto({ x: endX, y, z: 0 }, center, scale, offsetX, offsetY, to);
    drawCtx.beginPath();
    drawCtx.moveTo(from.x, from.y);
    drawCtx.lineTo(to.x, to.y);
    drawCtx.stroke();
  }

  drawCtx.restore();
}

function renderFrontGrid(drawCtx, bounds, width, height, offsetX, offsetY, scale) {
  const stepBase = Math.max(bounds.span.x, bounds.span.z, 50);
  const step = Math.max(1, Math.pow(10, Math.floor(Math.log10(stepBase)) - 1));
  const minX = Math.min(0, bounds.min.x);
  const maxX = Math.max(0, bounds.max.x);
  const minZ = Math.min(0, bounds.min.z);
  const maxZ = Math.max(0, bounds.max.z);
  const startX = Math.floor(minX / step) * step;
  const endX = Math.ceil(maxX / step) * step;
  const startZ = Math.floor(minZ / step) * step;
  const endZ = Math.ceil(maxZ / step) * step;
  const from = { x: 0, y: 0 };
  const to = { x: 0, y: 0 };
  drawCtx.save();
  drawCtx.strokeStyle = 'rgba(148, 163, 184, 0.10)';
  drawCtx.lineWidth = 1;
  for (let x = startX; x <= endX + (step * 0.001); x += step) {
    projectFrontInto({ x, y: 0, z: startZ }, bounds, scale, offsetX, offsetY, from);
    projectFrontInto({ x, y: 0, z: endZ }, bounds, scale, offsetX, offsetY, to);
    drawCtx.beginPath();
    drawCtx.moveTo(from.x, from.y);
    drawCtx.lineTo(to.x, to.y);
    drawCtx.stroke();
  }
  for (let z = startZ; z <= endZ + (step * 0.001); z += step) {
    projectFrontInto({ x: startX, y: 0, z }, bounds, scale, offsetX, offsetY, from);
    projectFrontInto({ x: endX, y: 0, z }, bounds, scale, offsetX, offsetY, to);
    drawCtx.beginPath();
    drawCtx.moveTo(from.x, from.y);
    drawCtx.lineTo(to.x, to.y);
    drawCtx.stroke();
  }
  drawCtx.restore();
}

function renderRightGrid(drawCtx, bounds, width, height, offsetX, offsetY, scale) {
  const stepBase = Math.max(bounds.span.y, bounds.span.z, 50);
  const step = Math.max(1, Math.pow(10, Math.floor(Math.log10(stepBase)) - 1));
  const minY = Math.min(0, bounds.min.y);
  const maxY = Math.max(0, bounds.max.y);
  const minZ = Math.min(0, bounds.min.z);
  const maxZ = Math.max(0, bounds.max.z);
  const startY = Math.floor(minY / step) * step;
  const endY = Math.ceil(maxY / step) * step;
  const startZ = Math.floor(minZ / step) * step;
  const endZ = Math.ceil(maxZ / step) * step;
  const from = { x: 0, y: 0 };
  const to = { x: 0, y: 0 };
  drawCtx.save();
  drawCtx.strokeStyle = 'rgba(148, 163, 184, 0.10)';
  drawCtx.lineWidth = 1;
  for (let y = startY; y <= endY + (step * 0.001); y += step) {
    projectRightInto({ x: 0, y, z: startZ }, bounds, scale, offsetX, offsetY, from);
    projectRightInto({ x: 0, y, z: endZ }, bounds, scale, offsetX, offsetY, to);
    drawCtx.beginPath();
    drawCtx.moveTo(from.x, from.y);
    drawCtx.lineTo(to.x, to.y);
    drawCtx.stroke();
  }
  for (let z = startZ; z <= endZ + (step * 0.001); z += step) {
    projectRightInto({ x: 0, y: startY, z }, bounds, scale, offsetX, offsetY, from);
    projectRightInto({ x: 0, y: endY, z }, bounds, scale, offsetX, offsetY, to);
    drawCtx.beginPath();
    drawCtx.moveTo(from.x, from.y);
    drawCtx.lineTo(to.x, to.y);
    drawCtx.stroke();
  }
  drawCtx.restore();
}

function renderAxes(drawCtx, bounds, width, height, offsetX, offsetY, scale, center) {
  const p0 = { x: 0, y: 0 };
  const p1 = { x: 0, y: 0 };
  const p2 = { x: 0, y: 0 };
  const p3 = { x: 0, y: 0 };
  const proj = (point, out) => {
    if (playback.viewMode === 'top') return projectTopInto(point, bounds, scale, offsetX, offsetY, out);
    if (playback.viewMode === 'front') return projectFrontInto(point, bounds, scale, offsetX, offsetY, out);
    if (playback.viewMode === 'right') return projectRightInto(point, bounds, scale, offsetX, offsetY, out);
    return projectPerspectiveInto(point, center, scale, offsetX, offsetY, out);
  };
  const origin = proj({ x: 0, y: 0, z: 0 }, p0);
  const xAxis = proj({ x: 25, y: 0, z: 0 }, p1);
  const yAxis = proj({ x: 0, y: 25, z: 0 }, p2);
  const zAxis = proj({ x: 0, y: 0, z: 25 }, p3);

  drawCtx.save();
  drawCtx.lineWidth = 2;
  const axesToDraw = playback.viewMode === 'front'
    ? [[xAxis, '#ef4444'], [zAxis, '#60a5fa']]
    : playback.viewMode === 'right'
      ? [[yAxis, '#22c55e'], [zAxis, '#60a5fa']]
      : [[xAxis, '#ef4444'], [yAxis, '#22c55e'], [zAxis, '#60a5fa']];

  axesToDraw.forEach(([endpoint, color]) => {
    drawCtx.strokeStyle = color;
    drawCtx.beginPath();
    drawCtx.moveTo(origin.x, origin.y);
    drawCtx.lineTo(endpoint.x, endpoint.y);
    drawCtx.stroke();
  });
  drawCtx.restore();
}

function renderStaticLayer(bounds, width, height, offsetX, offsetY, scale, center) {
  const key = [
    playback.viewMode,
    width,
    height,
    playback.zoom.toFixed(3),
    camera.yaw.toFixed(3),
    camera.pitch.toFixed(3),
    camera.panX.toFixed(1),
    camera.panY.toFixed(1),
    bounds.min.x.toFixed(3), bounds.min.y.toFixed(3), bounds.min.z.toFixed(3),
    bounds.max.x.toFixed(3), bounds.max.y.toFixed(3), bounds.max.z.toFixed(3)
  ].join('|');
  if (key !== staticLayerKey) {
    staticLayerCtx.clearRect(0, 0, width, height);
    if (playback.viewMode === 'top') {
      renderGrid(staticLayerCtx, bounds, width, height, offsetX, offsetY, scale);
    } else if (playback.viewMode === 'front') {
      renderFrontGrid(staticLayerCtx, bounds, width, height, offsetX, offsetY, scale);
    } else if (playback.viewMode === 'right') {
      renderRightGrid(staticLayerCtx, bounds, width, height, offsetX, offsetY, scale);
    } else {
      renderPerspectiveGrid(staticLayerCtx, bounds, center, width, height, offsetX, offsetY, scale);
    }
    renderAxes(staticLayerCtx, bounds, width, height, offsetX, offsetY, scale, center);
    staticLayerKey = key;
  }
  ctx.drawImage(staticLayerCanvas, 0, 0, width, height);
}

function render() {
  const width = canvasCssWidth;
  const height = canvasCssHeight;
  ctx.clearRect(0, 0, width, height);

  applyViewModeUi();

  if (!timeline) return;

  emptyState.style.display = 'none';
  const isBenchmark = playback.viewMode === 'benchmark';
  if (isBenchmark) {
    renderBenchmarkChart(width, height);
    renderBenchmarkDataTape();
    return;
  }
  setBenchmarkInfoText('');
  benchmarkTapePanel.classList.remove('active');
  const bounds = timeline.bounds;
  const center = {
    x: bounds.min.x + (bounds.span.x / 2),
    y: bounds.min.y + (bounds.span.y / 2),
    z: bounds.min.z + (bounds.span.z / 2)
  };
  const scale = computeSceneScale(bounds, width, height);
  const baseOffsetX = width * 0.5;
  const baseOffsetY = playback.viewMode === 'perspective' ? height * 0.58 : height * 0.5;
  const offsetX = baseOffsetX + camera.panX;
  const offsetY = baseOffsetY + camera.panY;
  const visibleSegmentEnd = getVisibleSegmentEnd();

  renderStaticLayer(bounds, width, height, offsetX, offsetY, scale, center);

  const visibleEnd = Math.min(visibleSegmentEnd, timeline.segments.length - 1);
  const from = { x: 0, y: 0 };
  const to = { x: 0, y: 0 };
  const rapidPath = new Path2D();
  const activePath = new Path2D();
  let hasRapid = false;
  let hasActive = false;

  // Headlight wire shading (Rhino "Shade Selected" style): light comes from the eye.
  // Brightness rises smoothly as a line turns perpendicular to the eye ray and falls
  // with distance from the eye. Fine-grained buckets keep it tonal while bounding
  // stroke calls to at most WIRE_BUCKET_COUNT per frame.
  const feedBuckets = new Array(WIRE_BUCKET_COUNT);

  // Camera view direction in world space (eye -> scene). For perspective this matches
  // the depth axis (z2) used by projectPerspectiveInto.
  let camDirX = 0, camDirY = 0, camDirZ = -1;
  let depthCenter = center;
  const isPerspective = playback.viewMode !== 'top' && playback.viewMode !== 'front' && playback.viewMode !== 'right';
  if (playback.viewMode === 'top') {
    camDirX = 0; camDirY = 0; camDirZ = -1;
  } else if (playback.viewMode === 'front') {
    camDirX = 0; camDirY = 1; camDirZ = 0;
  } else if (playback.viewMode === 'right') {
    camDirX = -1; camDirY = 0; camDirZ = 0;
  } else {
    const sinP = Math.sin(camera.pitch);
    camDirX = Math.sin(camera.yaw) * sinP;
    camDirY = Math.cos(camera.yaw) * sinP;
    camDirZ = -Math.cos(camera.pitch);
  }
  if (!isPerspective) {
    depthCenter = {
      x: bounds.min.x + (bounds.span.x / 2),
      y: bounds.min.y + (bounds.span.y / 2),
      z: bounds.min.z + (bounds.span.z / 2)
    };
  }
  // Eye sits 650 units behind the centre along the view axis (same as the projection).
  const eyeX = depthCenter.x - (camDirX * 650);
  const eyeY = depthCenter.y - (camDirY * 650);
  const eyeZ = depthCenter.z - (camDirZ * 650);
  // Depth range of the work envelope along the view axis, for distance attenuation.
  const depthHalf = Math.max(1e-3,
    Math.abs(camDirX * bounds.span.x * 0.5) +
    Math.abs(camDirY * bounds.span.y * 0.5) +
    Math.abs(camDirZ * bounds.span.z * 0.5));
  const depthInv = 1 / (2 * depthHalf);

  const projectInto = (point, out) => {
    if (playback.viewMode === 'top') return projectTopInto(point, bounds, scale, offsetX, offsetY, out);
    if (playback.viewMode === 'front') return projectFrontInto(point, bounds, scale, offsetX, offsetY, out);
    if (playback.viewMode === 'right') return projectRightInto(point, bounds, scale, offsetX, offsetY, out);
    return projectPerspectiveInto(point, center, scale, offsetX, offsetY, out);
  };

  const wireShading = playback.wireShading;
  const flatPath = wireShading ? null : new Path2D();
  let hasFeed = false;

  for (let index = 0; index <= visibleEnd; index += 1) {
    const segment = timeline.segments[index];
    projectInto(segment.from, from);
    projectInto(segment.to, to);
    const isActive = segment.commandId === playback.commandCursor;
    if (isActive) {
      activePath.moveTo(from.x, from.y);
      activePath.lineTo(to.x, to.y);
      hasActive = true;
    } else if (segment.motionType === 'rapid') {
      rapidPath.moveTo(from.x, from.y);
      rapidPath.lineTo(to.x, to.y);
      hasRapid = true;
    } else if (!wireShading) {
      flatPath.moveTo(from.x, from.y);
      flatPath.lineTo(to.x, to.y);
      hasFeed = true;
    } else {
      const f = segment.from;
      const t = segment.to;
      let tx = segment.tx;
      let ty = segment.ty;
      let tz = segment.tz;
      if (tx === undefined) {
        const dx = (t.x || 0) - (f.x || 0);
        const dy = (t.y || 0) - (f.y || 0);
        const dz = (t.z || 0) - (f.z || 0);
        const len = Math.hypot(dx, dy, dz);
        if (len > 1e-6) {
          tx = dx / len; ty = dy / len; tz = dz / len;
        } else {
          tx = 1; ty = 0; tz = 0;
        }
        segment.tx = tx; segment.ty = ty; segment.tz = tz;
        segment.isSlope = Math.abs(tz) > 0.005;
      }
      const mx = ((f.x || 0) + (t.x || 0)) * 0.5;
      const my = ((f.y || 0) + (t.y || 0)) * 0.5;
      const mz = ((f.z || 0) + (t.z || 0)) * 0.5;

      // Eye ray to this segment (per-segment in perspective, parallel in ortho views).
      let rx = camDirX, ry = camDirY, rz = camDirZ;
      if (isPerspective) {
        rx = mx - eyeX; ry = my - eyeY; rz = mz - eyeZ;
        const rl = Math.sqrt((rx * rx) + (ry * ry) + (rz * rz));
        if (rl > 1e-6) { rx /= rl; ry /= rl; rz /= rl; }
      }
      const dotV = (tx * rx) + (ty * ry) + (tz * rz);
      const sinTheta = Math.sqrt(Math.max(0, 1 - (dotV * dotV)));

      // 0 = nearest point of the envelope, 1 = farthest.
      const depth = ((mx - depthCenter.x) * camDirX) + ((my - depthCenter.y) * camDirY) + ((mz - depthCenter.z) * camDirZ);
      const depthNorm = Math.min(1, Math.max(0, (depth + depthHalf) * depthInv));

      const facing = sinTheta * sinTheta * (3 - (2 * sinTheta)); // smoothstep: soft roll-off near end-on
      const intensity = WIRE_AMBIENT + ((1 - WIRE_AMBIENT) * facing * (1 - (WIRE_DEPTH_FALLOFF * depthNorm)));
      const bIndex = Math.min(WIRE_BUCKET_COUNT - 1, Math.max(0, Math.round(intensity * (WIRE_BUCKET_COUNT - 1))));
      let bucket = feedBuckets[bIndex];
      if (!bucket) {
        bucket = new Path2D();
        feedBuckets[bIndex] = bucket;
      }
      bucket.moveTo(from.x, from.y);
      bucket.lineTo(to.x, to.y);
    }
  }

  if (hasRapid) {
    ctx.strokeStyle = 'rgba(96, 165, 250, 0.82)';
    ctx.lineWidth = 1.5;
    ctx.stroke(rapidPath);
  }

  if (!wireShading) {
    if (hasFeed) {
      ctx.strokeStyle = 'rgba(20, 184, 166, 0.88)';
      ctx.lineWidth = 2.2;
      ctx.stroke(flatPath);
    }
  } else {
    // Dark-to-bright so brighter (nearer, face-on) lines draw on top.
    for (let b = 0; b < WIRE_BUCKET_COUNT; b += 1) {
      if (feedBuckets[b]) {
        ctx.strokeStyle = WIRE_BUCKET_COLORS[b];
        ctx.lineWidth = WIRE_BUCKET_WIDTHS[b];
        ctx.stroke(feedBuckets[b]);
      }
    }
  }
  if (hasActive) {
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 3;
    ctx.stroke(activePath);
  }

  const activeCommand = timeline.commands[clampCommandCursor(playback.commandCursor)] || null;
  const viewLabel = {
    top: 'Top (XY)',
    front: 'Front (ZX)',
    right: 'Right (ZY)',
    perspective: 'Perspective'
  }[playback.viewMode] || playback.viewMode;

  setStatusText([
    `${timeline.title}`,
    `View: ${viewLabel}`,
    `Commands: ${timeline.commandCount}`,
    `Segments: ${timeline.segments.length}`,
    activeCommand ? `Active: ${activeCommand.display}` : 'Active: none'
  ].join('\n'));
}

let _lastCommandListSampleCount = -1;

function formatBenchmarkTapeNumber(value, digits = 1) {
  const numericValue = Number(value);
  if (!Number.isFinite(numericValue)) return '';
  return numericValue.toFixed(digits).replace(/\.0$/, '');
}

function formatBenchmarkTapeSample(sample) {
  const fields = sample.fields || {};
  const sampleDistance = Number(fields.distance ?? fields.dist ?? fields.d);
  const sampleAccel = Number(fields.accel ?? fields.a);
  const batch = Number(fields.batch ?? fields.cycles ?? fields.passes);
  const throughput = Number(fields.mm_per_min ?? fields.throughput_mm_min);
  const peak = Number(fields.peak_mm_min);
  const elapsed = formatBenchmarkTapeNumber(sample.elapsedMs || 0, 1);
  const fallbackLabel = [
    fields.method ? `method=${fields.method}` : '',
    Number.isFinite(Number(fields.round)) && Number(fields.round) > 0 ? `round=${Number(fields.round)}` : '',
    Number.isFinite(Number(fields.cmds ?? fields.commands)) && Number(fields.cmds ?? fields.commands) > 0 ? `cmds=${Number(fields.cmds ?? fields.commands)}` : ''
  ].filter(Boolean).join(' ');

  const head = Number.isFinite(sampleDistance) && Number.isFinite(sampleAccel)
    ? `${sampleDistance} mm @ ${sampleAccel} accel`
    : (fallbackLabel || 'Generic benchmark sample');
  const details = [`${elapsed} ms`];

  if (Number.isFinite(batch) && batch > 0) details.push(`${batch} cycle${batch === 1 ? '' : 's'}`);
  if (Number.isFinite(sampleDistance) && Number.isFinite(batch) && batch > 0) {
    details.push(`${formatBenchmarkTapeNumber(batch * 2 * sampleDistance, 2)} mm travel`);
  }
  if (Number.isFinite(throughput)) details.push(`${formatBenchmarkTapeNumber(throughput, 1)} mm/min`);
  if (Number.isFinite(peak)) details.push(`peak ${formatBenchmarkTapeNumber(peak, 1)} mm/min`);
  if (Number.isFinite(throughput) && Number.isFinite(peak) && peak > 0) {
    details.push(`avg/peak ${formatBenchmarkTapeNumber((throughput / peak) * 100, 0)}%`);
  }

  return `${head} | ${details.join(' | ')}`;
}

// Built-in (app-provided) fields usable in BENCH RECORDS templates via {_name}
function getBenchmarkTapeBuiltins(sample, sampleIndex) {
  return {
    elapsed: formatBenchmarkTapeNumber(sample.elapsedMs || 0, 1),
    sampleIndex: Number.isFinite(Number(sampleIndex)) ? Number(sampleIndex) + 1 : ''
  };
}

// Render a sample's tape label from BENCH RECORDS templates.
// Plain {field} substitution only; a segment whose fields are missing/NaN is dropped.
function renderBenchmarkTapeLabel(sample, sampleIndex, templates) {
  if (!Array.isArray(templates) || !templates.length) {
    return formatBenchmarkTapeSample(sample);
  }
  const fields = sample.fields || {};
  const builtins = getBenchmarkTapeBuiltins(sample, sampleIndex);
  const parts = [];
  for (const template of templates) {
    let missing = false;
    const rendered = String(template).replace(/\{([A-Za-z_][A-Za-z0-9_]*)\}/g, (_, name) => {
      const value = name.startsWith('_')
        ? builtins[name.slice(1).toLowerCase()]
        : fields[name.toLowerCase()];
      if (value === undefined || value === null || value === '' || !Number.isFinite(Number(value))) {
        missing = true;
        return '';
      }
      return String(value);
    });
    if (!missing && rendered.trim()) parts.push(rendered.trim());
  }
  return parts.length ? parts.join(' | ') : formatBenchmarkTapeSample(sample);
}

// Resolve the active BENCH RECORDS templates from the timeline benchmark data
function getBenchmarkRecordTemplates() {
  const templates = timeline?.benchmark?.recordTemplates;
  return Array.isArray(templates) ? templates : [];
}

function updateCommandListActive(previousCommandId, nextCommandId, shouldScroll = false) {
  if (!commandItems.length) return;
  if (previousCommandId === nextCommandId) return;
  const prevItem = commandItems[previousCommandId];
  if (prevItem && prevItem.parentNode === commandList) prevItem.classList.remove('active');
  let nextItem = commandItems[nextCommandId];
  if ((!nextItem || nextItem.parentNode !== commandList) && shouldScroll && virtualCount > 0) {
    // Active row is outside the rendered window — re-render the window around it
    ensureVirtualWindow(nextCommandId);
    nextItem = commandItems[nextCommandId];
  }
  if (nextItem) {
    nextItem.classList.add('active');
    if (shouldScroll) requestAnimationFrame(() => nextItem.scrollIntoView({ block: 'nearest' }));
  }
  lastActiveCommandId = nextCommandId;
}

// Build the display label for a command row (shared by virtual renderer)
function commandRowLabel(command) {
  const sourceLabel = command.sourceLine ? `L${command.sourceLine}` : 'GEN';
  const segmentLabel = command.firstSegment === -1
    ? 'non-motion'
    : `seg ${command.firstSegment + 1}-${command.lastSegment + 1}`;
  return `${String(command.commandId + 1).padStart(4, '0')} | ${sourceLabel} | ${segmentLabel} | ${command.display || command.raw}`;
}

// Create or recycle a row element inside the window
function acquireVirtualRow(index) {
  let item = commandItems[index];
  if (!item) {
    item = document.createElement('li');
    commandItems[index] = item;
  }
  return item;
}

// Render rows [start, end) into the list, recycling elements.
// mode: 'commands' (timeline.commands) or 'benchmark' (reversed sample list)
function renderVirtualWindow(start, end) {
  const clampedStart = Math.max(0, start);
  const clampedEnd = Math.min(virtualCount, end);
  virtualRange.start = clampedStart;
  virtualRange.end = clampedEnd;

  // Detach rows that fall outside the new window so the DOM stays small
  const keep = new Set();
  for (let i = clampedStart; i < clampedEnd; i += 1) {
    const item = acquireVirtualRow(i);
    if (item.parentNode !== commandList) commandList.appendChild(item);
    keep.add(item);
  }
  Array.from(commandList.children).forEach(child => {
    if (child !== virtualSpacer && !keep.has(child)) child.remove();
  });

  if (virtualMode === 'commands') {
    for (let i = clampedStart; i < clampedEnd; i += 1) {
      const command = timeline.commands[i];
      if (!command) continue;
      const item = acquireVirtualRow(i);
      item.style.top = `${i * COMMAND_ROW_HEIGHT}px`;
      item.className = `command-item${command.commandId === playback.commandCursor ? ' active' : ''}${selectedCommandIds.has(i) ? ' selected' : ''}`;
      item.dataset.commandId = String(command.commandId);
      delete item.dataset.benchmarkSampleIndex;
      const label = commandRowLabel(command);
      if (item.textContent !== label) item.textContent = label;
      item.title = label;
    }
  } else if (virtualMode === 'benchmark') {
    const benchSamples = getBenchmarkSamples();
    for (let i = clampedStart; i < clampedEnd; i += 1) {
      const sampleIndex = virtualCount - 1 - i; // reversed order, matches old behavior
      const sample = benchSamples[sampleIndex];
      if (!sample) continue;
      const item = acquireVirtualRow(i);
      item.style.top = `${i * COMMAND_ROW_HEIGHT}px`;
      item.className = `command-item${selectedBenchmarkSampleIndexes.has(sampleIndex) ? ' selected' : ''}`;
      item.dataset.benchmarkSampleIndex = String(sampleIndex);
      delete item.dataset.commandId;
      const label = renderBenchmarkTapeLabel(sample, sampleIndex, getBenchmarkRecordTemplates());
      if (item.textContent !== label) item.textContent = label;
      item.title = label;
    }
  }
}

// Ensure the window covers rowIndex; re-render if needed
function ensureVirtualWindow(rowIndex) {
  if (virtualMode === null || virtualCount === 0) return;
  const viewportHeight = commandList.clientHeight || 400;
  const visibleRows = Math.ceil(viewportHeight / COMMAND_ROW_HEIGHT);
  let start;
  if (rowIndex == null) {
    start = Math.floor(commandList.scrollTop / COMMAND_ROW_HEIGHT);
  } else {
    start = rowIndex - Math.floor(visibleRows / 2);
  }
  start = Math.max(0, Math.min(virtualCount - visibleRows, start));
  const end = Math.min(virtualCount, start + visibleRows + COMMAND_WINDOW_BUFFER * 2);
  if (rowIndex == null && start >= virtualRange.start && end <= virtualRange.end && virtualRange.end > virtualRange.start) return;
  if (rowIndex != null && rowIndex >= virtualRange.start && rowIndex < virtualRange.end) return;
  renderVirtualWindow(start, end);
}

function resetVirtualState() {
  virtualRange = { start: 0, end: 0 };
  virtualMode = null;
  virtualCount = 0;
  commandItems = [];
  if (virtualSpacer) { virtualSpacer.remove(); virtualSpacer = null; }
  commandList.innerHTML = '';
}

function setupVirtualSpacer(count) {
  virtualCount = count;
  if (!virtualSpacer) {
    virtualSpacer = document.createElement('li');
    virtualSpacer.style.listStyle = 'none';
    virtualSpacer.style.border = 'none';
    virtualSpacer.style.padding = '0';
    virtualSpacer.style.pointerEvents = 'none';
  }
  virtualSpacer.style.height = `${count * COMMAND_ROW_HEIGHT}px`;
  if (virtualSpacer.parentNode !== commandList) commandList.appendChild(virtualSpacer);
}

function renderCommandList() {
  if (!timeline) { resetVirtualState(); lastActiveCommandId = -1; _lastCommandListSampleCount = -1; return; }

    selectedCommandIds = new Set();
    lastClickedCommandId = null;
  const benchSamples = getBenchmarkSamples();
  if ((!timeline.commands || !timeline.commands.length) && benchSamples.length) {
    // Skip full rebuild if sample count hasn't changed
    if (benchSamples.length === _lastCommandListSampleCount) return;
    _lastCommandListSampleCount = benchSamples.length;
    resetVirtualState();
    lastActiveCommandId = -1;
    selectedBenchmarkSampleIndexes.clear();
    lastClickedBenchmarkSampleIndex = null;
    virtualMode = 'benchmark';
    setupVirtualSpacer(benchSamples.length);
    renderVirtualWindow(0, Math.ceil((commandList.clientHeight || 400) / COMMAND_ROW_HEIGHT) + COMMAND_WINDOW_BUFFER * 2);
    refreshSelectedStyles();
    updateAiContextBar();
    return;
  }

  _lastCommandListSampleCount = -1;
  resetVirtualState();
  lastActiveCommandId = -1;
  selectedBenchmarkSampleIndexes.clear();
  lastClickedBenchmarkSampleIndex = null;
  if (!timeline.commands.length) return;

    updateAiContextBar();
  virtualMode = 'commands';
  setupVirtualSpacer(timeline.commands.length);
  renderVirtualWindow(0, Math.ceil((commandList.clientHeight || 400) / COMMAND_ROW_HEIGHT) + COMMAND_WINDOW_BUFFER * 2);
  updateCommandListActive(-1, playback.commandCursor, true);
}

function isBenchmarkOnlyTimeline(candidate) {
  return Boolean(
    candidate &&
    candidate.benchmark &&
    !Number(candidate.commandCount || 0) &&
    (!Array.isArray(candidate.segments) || !candidate.segments.length)
  );
}

function createWaitingBenchmarkTimeline(title, previousTimeline = null) {
  const previousBenchmark = previousTimeline?.benchmark || null;
  return {
    title,
    commands: [],
    commandCount: 0,
    segments: [],
    stats: {
      motionCommandCount: 0,
      errorCount: 0
    },
    bounds: {
      min: { x: 0, y: 0, z: 0 },
      max: { x: 0, y: 0, z: 0 },
      span: { x: 0, y: 0, z: 0 }
    },
    commandToLastSegment: [],
    benchmark: previousBenchmark || {
      title,
      sampleCount: 0,
      summary: [],
      series: [],
      samples: [],
      records: [],
      activeMarkers: [],
      meta: {
        title,
        xField: 'sampleIndex',
        yField: 'elapsedMs',
        seriesField: '',
        xLabel: 'Sample',
        yLabel: 'Elapsed (ms)',
        description: 'Waiting for live BENCH samples'
      }
    }
  };
}

function loadTimeline(nextTimeline) {
  const previousTimeline = timeline;
  const previousViewMode = playback.viewMode;

  // Precompute unit tangents and slope detection for all motion segments (one-time fast cache)
  if (Array.isArray(nextTimeline?.segments)) {
    for (let i = 0; i < nextTimeline.segments.length; i += 1) {
      const seg = nextTimeline.segments[i];
      if (seg.tx === undefined) {
        const dx = (seg.to.x || 0) - (seg.from.x || 0);
        const dy = (seg.to.y || 0) - (seg.from.y || 0);
        const dz = (seg.to.z || 0) - (seg.from.z || 0);
        const len = Math.hypot(dx, dy, dz);
        if (len > 1e-6) {
          seg.tx = dx / len;
          seg.ty = dy / len;
          seg.tz = dz / len;
          seg.isSlope = Math.abs(seg.tz) > 0.005;
        } else {
          seg.tx = 1;
          seg.ty = 0;
          seg.tz = 0;
          seg.isSlope = false;
        }
      }
    }
  }

  // If an update arrives without benchmark payload, retain the existing benchmark
  // data so the chart doesn't disappear at script completion due unrelated refreshes.
  if (!nextTimeline?.benchmark && previousTimeline?.benchmark) {
    nextTimeline = { ...nextTimeline, benchmark: previousTimeline.benchmark };
  }

  timeline = nextTimeline;
  titleEl.textContent = timeline.title || 'GRBL Preview';
  const benchmarkSampleCount = Number(timeline?.benchmark?.sampleCount || 0);
  const benchmarkActiveCount = Number(timeline?.benchmark?.activeMarkers?.length || 0);
  statsEl.textContent = benchmarkSampleCount
    ? `${timeline.stats.motionCommandCount} motion command(s) | ${benchmarkSampleCount} benchmark sample(s)`
    : `${timeline.stats.motionCommandCount} motion command(s) | ${timeline.stats.errorCount} error(s)`;

  const nextIsBenchmarkOnly = isBenchmarkOnlyTimeline(timeline);
  const prevIsBenchmarkOnly = isBenchmarkOnlyTimeline(previousTimeline);
  const nextHasBenchmark = Boolean(timeline?.benchmark);
  const prevHasBenchmark = Boolean(previousTimeline?.benchmark);

  if (nextIsBenchmarkOnly && (benchmarkSampleCount > 0 || benchmarkActiveCount > 0 || previousViewMode === 'benchmark')) {
    playback.viewMode = 'benchmark';
  }

  // Avoid visual flicker during live benchmark updates by not rewinding playback
  // when we are receiving successive benchmark payloads.
  if (!((prevIsBenchmarkOnly && nextIsBenchmarkOnly) || (previousViewMode === 'benchmark' && prevHasBenchmark && nextHasBenchmark))) {
    resetPlayback();
  } else {
    syncPlaybackUi();
  }
  renderCommandList();
  syncQueuePanelUi();
  render();
}

function loadWaitingState(payload = null) {
  const waitingTitle = String(payload?.title || 'GRBL Preview').trim() || 'GRBL Preview';
  const waitingMessage = String(payload?.message || 'Waiting for benchmarking data...').trim() || 'Waiting for benchmarking data...';
  const previousTimeline = timeline;

  timeline = createWaitingBenchmarkTimeline(waitingTitle, previousTimeline);
  playback.playing = false;
  playback.commandCursor = 0;
  playback.accumulatorMs = 0;
  playback.lastFrameAt = 0;
  playback.viewMode = 'benchmark';

  titleEl.textContent = waitingTitle;
  statsEl.textContent = 'Waiting for benchmark data';
  setStatusText(`${waitingTitle}\n${waitingMessage}`);
  setBenchmarkInfoText(`${waitingTitle}\nView: Benchmark\n${waitingMessage}`);
  emptyState.style.display = 'none';
  emptyState.innerHTML = '<strong>Waiting for benchmark data.</strong><br>Run a GCOM script with BENCH START / BENCH END markers.';
  resetVirtualState();
  lastActiveCommandId = -1;
  commandProgress.textContent = '0 / 0';
  benchmarkTapePanel.classList.remove('active');
  _lastTapeSampleCount = -1;
  _lastCommandListSampleCount = -1;

  applyViewModeUi();
  syncPlaybackUi();
  syncQueuePanelUi();
  render();
}

function stripCommandComments(text) {
  return String(text || '')
    .replace(/\([^)]*\)/g, ' ')
    .replace(/;.*$/g, ' ')
    .trim();
}

function collectQueueLines(includeNonMotion) {
  if (!timeline || !timeline.commands || !timeline.commands.length) return [];
  const lines = [];
  timeline.commands.forEach(command => {
    if (!includeNonMotion && command.firstSegment === -1) return;
    const raw = String(command.raw || command.display || '').trim();
    if (!raw.length) return;
    if (!stripCommandComments(raw).length) return;
    lines.push(raw);
  });
  return lines;
}

// ==== AI Context Selection ====

function refreshSelectedStyles() {
  commandItems.forEach((item, id) => {
    if (!item || item.parentNode !== commandList) return;
    const benchmarkSampleIndex = item.dataset.benchmarkSampleIndex != null
      ? Number(item.dataset.benchmarkSampleIndex)
      : null;
    if (Number.isFinite(benchmarkSampleIndex)) {
      if (selectedBenchmarkSampleIndexes.has(benchmarkSampleIndex)) item.classList.add('selected');
      else item.classList.remove('selected');
      return;
    }
    if (selectedCommandIds.has(id)) item.classList.add('selected');
    else item.classList.remove('selected');
  });
}

function updateAiContextBar() {
  const commandCount = selectedCommandIds.size;
  const sampleCount = selectedBenchmarkSampleIndexes.size;
  const count = commandCount + sampleCount;
  if (count === 0) {
    aiContextCount.textContent = '0 selected';
  } else if (sampleCount > 0 && commandCount === 0) {
    aiContextCount.textContent = `${sampleCount} sample${sampleCount === 1 ? '' : 's'} selected`;
  } else {
    aiContextCount.textContent = `${commandCount} command${commandCount === 1 ? '' : 's'} selected`;
  }
  const openerReady = Boolean(window.opener && !window.opener.closed);
  sendToAiBtn.disabled = count === 0 || !openerReady;
}

function buildBenchmarkSelectionPayload() {
  const samples = getBenchmarkSamples();
  if (!timeline || !samples.length || !selectedBenchmarkSampleIndexes.size) return null;
  const selectedSamples = [...selectedBenchmarkSampleIndexes]
    .sort((a, b) => a - b)
    .map(sampleIndex => ({ sampleIndex, sample: samples[sampleIndex] }))
    .filter(entry => entry.sample);
  if (!selectedSamples.length) return null;

  const throughputs = selectedSamples
    .map(entry => Number(entry.sample.fields?.mm_per_min ?? entry.sample.fields?.throughput_mm_min))
    .filter(Number.isFinite);
  const peaks = selectedSamples
    .map(entry => Number(entry.sample.fields?.peak_mm_min))
    .filter(Number.isFinite);
  const distances = [...new Set(selectedSamples.map(entry => entry.sample.fields?.distance).filter(value => value != null))];
  const accels = selectedSamples
    .map(entry => Number(entry.sample.fields?.accel))
    .filter(Number.isFinite);
  const elapsedValues = selectedSamples
    .map(entry => Number(entry.sample.elapsedMs))
    .filter(Number.isFinite);
  const fastest = selectedSamples.reduce((best, entry) => {
    const throughput = Number(entry.sample.fields?.mm_per_min ?? entry.sample.fields?.throughput_mm_min);
    if (!Number.isFinite(throughput)) return best;
    if (!best || throughput > best.throughputMmMin) {
      return { sampleIndex: entry.sampleIndex, throughputMmMin: throughput, fields: entry.sample.fields || {} };
    }
    return best;
  }, null);

  return {
    selectionSummary: {
      selectedBenchmarkSampleCount: selectedSamples.length,
      selectedBenchmarkSampleIndexes: selectedSamples.map(entry => entry.sampleIndex),
      selectedDistances: distances,
      minAccel: accels.length ? Math.min(...accels) : null,
      maxAccel: accels.length ? Math.max(...accels) : null,
      note: 'User selected benchmark samples for special attention. Interpret them within the full benchmark series and raw records.'
    },
    benchmark: {
      metadata: timeline.benchmark?.meta || {},
      summary: getBenchmarkSummary(),
      selectedSamples: selectedSamples.map(entry => ({
        sampleIndex: entry.sampleIndex,
        tapeLabel: renderBenchmarkTapeLabel(entry.sample, entry.sampleIndex, getBenchmarkRecordTemplates()),
        ...entry.sample
      })),
      selectedTape: selectedSamples.map(entry => renderBenchmarkTapeLabel(entry.sample, entry.sampleIndex, getBenchmarkRecordTemplates())),
      fastestSelectedSample: fastest,
      selectedStats: {
        avgThroughputMmMin: throughputs.length ? Math.round((throughputs.reduce((sum, value) => sum + value, 0) / throughputs.length) * 10) / 10 : null,
        maxThroughputMmMin: throughputs.length ? Math.max(...throughputs) : null,
        maxPeakMmMin: peaks.length ? Math.max(...peaks) : null,
        avgElapsedMs: elapsedValues.length ? Math.round((elapsedValues.reduce((sum, value) => sum + value, 0) / elapsedValues.length) * 10) / 10 : null
      }
    },
    scriptTitle: timeline.title || 'Untitled',
    scriptSource: String(timeline.scriptSource || '').split('\n').slice(0, 150).join('\n')
  };
}

function buildAiSelectionPayload() {
  if (selectedBenchmarkSampleIndexes.size) return buildBenchmarkSelectionPayload();
  if (!timeline || !timeline.commands) return null;
  const sourceLines = String(timeline.scriptSource || '').split('\n');
  const gcomLineToPhysicalIndex = new Map();
  sourceLines.forEach((text, index) => {
    const match = String(text || '').match(/^\s*(\d+)\s+/);
    if (!match) return;
    const gcomLine = parseInt(match[1], 10);
    if (Number.isFinite(gcomLine)) gcomLineToPhysicalIndex.set(gcomLine, index);
  });

  const selectedCmds = [];
  const selectedSegments = [];
  const usedSourceLineNums = new Set();
  const selectedCommandIdSet = new Set();
  const commandTape = timeline.commands.map(cmd => ({
    commandId: cmd.commandId,
    sourceLine: cmd.sourceLine,
    raw: cmd.raw,
    display: cmd.display,
    firstSegment: cmd.firstSegment,
    lastSegment: cmd.lastSegment
  }));

  for (const id of [...selectedCommandIds].sort((a, b) => a - b)) {
    const cmd = timeline.commands[id];
    if (!cmd) continue;
    selectedCommandIdSet.add(cmd.commandId);
    selectedCmds.push({
      commandId: cmd.commandId,
      sourceLine: cmd.sourceLine,
      raw: cmd.raw,
      display: cmd.display,
      firstSegment: cmd.firstSegment,
      lastSegment: cmd.lastSegment
    });
    if (cmd.sourceLine != null) usedSourceLineNums.add(cmd.sourceLine);
    if (cmd.firstSegment >= 0) {
      for (let si = cmd.firstSegment; si <= cmd.lastSegment; si += 1) {
        const seg = timeline.segments[si];
        if (seg) selectedSegments.push({
          commandId: seg.commandId,
          sourceLine: seg.sourceLine,
          raw: seg.raw,
          motionType: seg.motionType,
          feedRate: seg.feedRate ?? null,
          from: { x: seg.from.x, y: seg.from.y, z: seg.from.z ?? 0 },
          to:   { x: seg.to.x,   y: seg.to.y,   z: seg.to.z   ?? 0 }
        });
      }
    }
  }

  // Collect the GCOM source line text for each referenced line (plus 1 line of context either side)
  const contextLines = [];
  const addedLineNums = new Set();
  for (const lineNum of [...usedSourceLineNums].sort((a, b) => a - b)) {
    const physicalIndex = gcomLineToPhysicalIndex.has(lineNum)
      ? gcomLineToPhysicalIndex.get(lineNum)
      : (lineNum >= 1 && lineNum <= sourceLines.length ? lineNum - 1 : -1);
    if (physicalIndex < 0) continue;
    for (let idx = Math.max(0, physicalIndex - 1); idx <= Math.min(sourceLines.length - 1, physicalIndex + 1); idx += 1) {
      const physicalLineNumber = idx + 1;
      if (addedLineNums.has(physicalLineNumber)) continue;
      addedLineNums.add(physicalLineNumber);
      const text = sourceLines[idx] ?? '';
      if (!text.trim()) continue;
      const match = String(text).match(/^\s*(\d+)\s+/);
      contextLines.push({
        physicalLineNumber,
        lineNumber: match ? parseInt(match[1], 10) : physicalLineNumber,
        text
      });
    }
  }

  // Geometric summary over selected segments
  let totalDistance = 0;
  const feedRates = [];
  const motionTypesSet = new Set();
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  let minZ = Infinity, maxZ = -Infinity;
  for (const seg of selectedSegments) {
    const dx = seg.to.x - seg.from.x;
    const dy = seg.to.y - seg.from.y;
    const dz = seg.to.z - seg.from.z;
    totalDistance += Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (seg.feedRate != null) feedRates.push(seg.feedRate);
    motionTypesSet.add(seg.motionType);
    for (const pt of [seg.from, seg.to]) {
      if (pt.x < minX) minX = pt.x; if (pt.x > maxX) maxX = pt.x;
      if (pt.y < minY) minY = pt.y; if (pt.y > maxY) maxY = pt.y;
      if (pt.z < minZ) minZ = pt.z; if (pt.z > maxZ) maxZ = pt.z;
    }
  }

  const allSourceLineNums = selectedCmds.map(c => c.sourceLine).filter(n => n != null);

  return {
    selectionSummary: {
      selectedCommandCount: selectedCmds.length,
      selectedSegmentCount: selectedSegments.length,
      selectedCommandIds: [...selectedCommandIdSet].sort((a, b) => a - b),
      note: 'User selected these commands or segments for special attention. Interpret them within the context of the full command tape and whole script.'
    },
    commands: selectedCmds,
    segments: selectedSegments,
    commandTape,
    // Nearby GCOM source lines for each selected command — gives the AI the genesis of these moves
    sourceContext: contextLines,
    // Full script source (first 150 lines max) so the AI can see the overall program structure
    scriptSource: sourceLines.slice(0, 150).join('\n'),
    scriptTitle: timeline.title || 'Untitled',
    geometric: {
      totalDistanceMm: Math.round(totalDistance * 1000) / 1000,
      avgFeedRate: feedRates.length
        ? Math.round(feedRates.reduce((a, b) => a + b, 0) / feedRates.length)
        : null,
      motionTypes: [...motionTypesSet],
      minSourceLine: allSourceLineNums.length ? Math.min(...allSourceLineNums) : null,
      maxSourceLine: allSourceLineNums.length ? Math.max(...allSourceLineNums) : null,
      bounds: selectedSegments.length ? {
        min: { x: minX, y: minY, z: minZ },
        max: { x: maxX, y: maxY, z: maxZ }
      } : null
    },
    totalCommandsInScript: timeline.commandCount,
    totalSegmentsInScript: timeline.segments.length,
    scriptStats: timeline.stats
  };
}

sendToAiBtn.addEventListener('click', () => {
  if (!window.opener || window.opener.closed) { updateAiContextBar(); return; }
  const payload = buildAiSelectionPayload();
  if (!payload) return;
  window.opener.postMessage({ type: 'preview-selection', payload }, window.location.origin);
  sendToAiBtn.textContent = 'Sent ✓';
  sendToAiBtn.disabled = true;
  setTimeout(() => { sendToAiBtn.textContent = 'Send to AI'; updateAiContextBar(); }, 1800);
});

function syncQueuePanelUi() {
  const hasTimeline = Boolean(timeline && timeline.commands && timeline.commands.length);
  const openerReady = Boolean(window.opener && !window.opener.closed);
  queueFromPreviewBtn.disabled = !hasTimeline || !openerReady;
  if (!hasTimeline) {
    queueStatus.textContent = 'Load a preview to enable queue export.';
    return;
  }
  if (!openerReady) {
    queueStatus.textContent = 'Queue unavailable: open preview from the main app.';
    return;
  }
  queueStatus.textContent = 'Queue target ready.';
}

function requestQueueFromPreview() {
  if (!timeline) return;
  if (!window.opener || window.opener.closed) {
    queueStatus.textContent = 'Queue unavailable: opener window not available.';
    syncQueuePanelUi();
    return;
  }
  const includeNonMotion = Boolean(queueIncludeNonMotion.checked);
  const lines = collectQueueLines(includeNonMotion);
  if (!lines.length) {
    queueStatus.textContent = includeNonMotion
      ? 'No commands available to queue.'
      : 'No motion commands found with current filter.';
    return;
  }
  const mode = queueModeSelect.value === 'fast-buffer' ? 'fast-buffer' : 'sync-ack';
  const payload = {
    type: 'preview-queue-gcode',
    payload: {
      mode,
      includeNonMotion,
      sourceTitle: timeline.title || 'Preview Job',
      raw: lines.join('\n')
    }
  };
  try {
    window.opener.postMessage(payload, window.location.origin);
    queueStatus.textContent = `Queued ${lines.length} command(s) to main window.`;
  } catch {
    queueStatus.textContent = 'Queue request failed to post to main window.';
  }
}

function tick(timestamp) {
  if (playback.playing && timeline && timeline.commandCount > 0) {
    if (!playback.lastFrameAt) playback.lastFrameAt = timestamp;
    playback.accumulatorMs += (timestamp - playback.lastFrameAt);
    playback.lastFrameAt = timestamp;
    const nextStepMs = playback.baseCommandMs / Math.max(0.25, playback.speed);
    let advanced = false;
    const previousCursor = playback.commandCursor;
    while (playback.accumulatorMs >= nextStepMs) {
      playback.accumulatorMs -= nextStepMs;
      if (playback.commandCursor >= timeline.commandCount - 1) {
        playback.playing = false;
        playback.accumulatorMs = 0;
        break;
      }
      playback.commandCursor += 1;
      advanced = true;
    }
    if (advanced) {
      syncPlaybackUi();
      updateCommandListActive(previousCursor, playback.commandCursor, true);
      render();
    }
  } else {
    playback.lastFrameAt = timestamp;
  }
  requestAnimationFrame(tick);
}

playBtn.addEventListener('click', () => {
  if (!timeline || !timeline.commandCount) return;
  if (!playback.playing && playback.commandCursor >= timeline.commandCount - 1) {
    setCommandCursor(0);
  }
  playback.playing = !playback.playing;
  syncPlaybackUi();
});
rewindBtn.addEventListener('click', () => {
  playback.playing = false;
  setCommandCursor(0);
});
stepBackBtn.addEventListener('click', () => {
  playback.playing = false;
  stepCommands(-1);
});
stepForwardBtn.addEventListener('click', () => {
  playback.playing = false;
  stepCommands(1);
});
endBtn.addEventListener('click', jumpToEnd);
fitBtn.addEventListener('click', fitPreview);
shadingBtn.addEventListener('click', () => {
  playback.wireShading = !playback.wireShading;
  syncPlaybackUi();
  render();
});
tapeCopyBtn.addEventListener('click', copyBenchmarkDataToClipboard);
viewSelect.addEventListener('change', () => {
  playback.viewMode = viewSelect.value;
  applyViewModeUi();
  render();
});
speedSelect.addEventListener('change', () => {
  playback.speed = Number(speedSelect.value) || 1;
  syncPlaybackUi();
});
canvas.addEventListener('wheel', applyWheelZoom, { passive: false });
queueFromPreviewBtn.addEventListener('click', requestQueueFromPreview);

// ==== Virtualized command list: delegated click + scroll ====

commandList.addEventListener('click', (e) => {
  const item = e.target.closest('.command-item');
  if (!item || item === virtualSpacer) return;
